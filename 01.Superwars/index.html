<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superwars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Times New Roman", Georgia, serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      padding-top: 20px;
    }

    /* Main Arena Layout */
    .arena {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 60px;
    }

    /* Left & Right Card Groups */
    .team {
      display: flex;
      gap: 14px;
    }

    /* Individual Character Card */
    .card {
      width: 115px;
      height: 215px;
      background-color: #ffffff;
      border: 1.5px solid #d3d3d3;
      border-radius: 8px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .card img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .card .name {
      font-size: 13px;
      line-height: 1.25;
      color: #111111;
      margin-bottom: 6px;
    }

    .card .score {
      font-size: 32px;
      font-weight: 400;
      color: #000000;
      line-height: 1.1;
    }

    /* Center Scoreboard */
    .scoreboard {
      font-size: 34px;
      font-weight: 400;
      color: #000000;
      padding-top: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <main class="arena">
    <!-- Left Team -->
    <section class="team">
      <div class="card">
        <img src="./super-1.png" alt="Spiderman" />
        <p class="name">Spiderman</p>
        <p class="score">12</p>
      </div>

      <div class="card">
        <img src="./super-3.png" alt="Wonder Women" />
        <p class="name">Wonder<br />Women</p>
        <p class="score">30</p>
      </div>
    </section>

    <!-- Center Score -->
    <div class="scoreboard">5 - 0</div>

    <!-- Right Team -->
    <section class="team">
      <div class="card">
        <img src="./super-2.png" alt="Captain America" />
        <p class="name">Captain<br />America</p>
        <p class="score">50</p>
      </div>

      <div class="card">
        <img src="./super-4.png" alt="Gem Woman" />
        <p class="name">Gem Woman</p>
        <p class="score">12</p>
      </div>
    </section>
  </main>

</body>
</html>
