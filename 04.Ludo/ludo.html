
<!DOCTYPE html>
<html>
<head>
    <title>Ludo Board</title>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
        }

        /* Main Board */

        .board {
            width: 780px;
            height: 780px;
            max-width: 98vw;
            max-height: 98vw;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 2px solid red;
            box-sizing: border-box;
        }

        /* Four Home Areas */

        .red-home {
            grid-area: 1 / 1 / 7 / 7;
            background: red;
        }

        .green-home {
            grid-area: 1 / 10 / 7 / 16;
            background: green;
        }

        .blue-home {
            grid-area: 10 / 1 / 16 / 7;
            background: blue;
        }

        .yellow-home {
            grid-area: 10 / 10 / 16 / 16;
            background: yellow;
        }

        /* White Inner Box */

        .home {
            width: 66.66%;
            height: 66.66%;
            background: white;
            margin: auto;
            position: relative;
            top: 16.66%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            justify-items: center;
            align-items: center;
        }

        /* Circles */

        .circle {
            width: 70px;
            height: 70px;
            border: 6px solid;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .red-circle {
            border-color: red;
        }

        .green-circle {
            border-color: green;
        }

        .blue-circle {
            border-color: blue;
        }

        .yellow-circle {
            border-color: yellow;
        }

        /* All Four Paths */

        .path {
            display: grid;
        }

        .top-path {
            grid-area: 1 / 7 / 7 / 10;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .left-path {
            grid-area: 7 / 1 / 10 / 7;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .right-path {
            grid-area: 7 / 10 / 10 / 16;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .bottom-path {
            grid-area: 10 / 7 / 16 / 10;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        /* Individual Boxes */

        .cell {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: black;
            box-sizing: border-box;
        }

        .red-cell {
            background: red;
        }

        .green-cell {
            background: green;
        }

        .blue-cell {
            background: blue;
        }

        .yellow-cell {
            background: yellow;
        }

        /* Center Area */

        .center {
            grid-area: 7 / 7 / 10 / 10;
            position: relative;
        }

        .triangle {
            position: absolute;
            width: 50%;
            height: 50%;
        }

        .green-triangle {
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: green;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .yellow-triangle {
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: yellow;
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
        }

        .blue-triangle {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: blue;
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
        }

        .red-triangle {
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: red;
            clip-path: polygon(0 0, 0 100%, 100% 50%);
        }

    </style>
</head>

<body>

<div class="board">

    <!-- RED HOME -->

    <div class="red-home">
        <div class="home">
            <div class="circle red-circle"></div>
            <div class="circle red-circle"></div>
            <div class="circle red-circle"></div>
            <div class="circle red-circle"></div>
        </div>
    </div>

    <!-- GREEN HOME -->

    <div class="green-home">
        <div class="home">
            <div class="circle green-circle"></div>
            <div class="circle green-circle"></div>
            <div class="circle green-circle"></div>
            <div class="circle green-circle"></div>
        </div>
    </div>

    <!-- BLUE HOME -->

    <div class="blue-home">
        <div class="home">
            <div class="circle blue-circle"></div>
            <div class="circle blue-circle"></div>
            <div class="circle blue-circle"></div>
            <div class="circle blue-circle"></div>
        </div>
    </div>

    <!-- YELLOW HOME -->

    <div class="yellow-home">
        <div class="home">
            <div class="circle yellow-circle"></div>
            <div class="circle yellow-circle"></div>
            <div class="circle yellow-circle"></div>
            <div class="circle yellow-circle"></div>
        </div>
    </div>

    <!-- TOP PATH -->

    <div class="path top-path">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell green-cell">★</div>

        <div class="cell green-cell">★</div>
        <div class="cell green-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell"></div>
    </div>

    <!-- LEFT PATH -->

    <div class="path left-path">
        <div class="cell"></div>
        <div class="cell red-cell">★</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell red-cell"></div>
        <div class="cell red-cell"></div>
        <div class="cell red-cell"></div>
        <div class="cell red-cell"></div>
        <div class="cell red-cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell red-cell">★</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <!-- RIGHT PATH -->

    <div class="path right-path">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell">★</div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell yellow-cell"></div>
        <div class="cell yellow-cell"></div>
        <div class="cell yellow-cell"></div>
        <div class="cell yellow-cell"></div>
        <div class="cell yellow-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell">★</div>
        <div class="cell"></div>
    </div>

    <!-- BOTTOM PATH -->

    <div class="path bottom-path">
        <div class="cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell blue-cell">★</div>

        <div class="cell blue-cell">★</div>
        <div class="cell blue-cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <!-- CENTER -->

    <div class="center">
        <div class="triangle green-triangle"></div>
        <div class="triangle yellow-triangle"></div>
        <div class="triangle blue-triangle"></div>
        <div class="triangle red-triangle"></div>
    </div>

</div>

</body>
</html>
